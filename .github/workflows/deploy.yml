name: Deploy to rodya.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

# Параллельные выкатки в один docroot ни к чему, но и обрывать
# уже начавшуюся выкатку на полпути нельзя — очередь без отмены.
concurrency:
  group: deploy-rodya-ru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, rodya-ru]

    steps:
      - uses: actions/checkout@v4

      # /deploy — это bind-mount /home/rodya-ru, который nginx отдаёт
      # как docroot rodya.ru. Перезапускать ничего не надо: статика.
      - name: Зеркалировать репозиторий в docroot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$GITHUB_WORKSPACE/" /deploy/

      - name: Проверить, что сайт отвечает
        run: curl -fsS -o /dev/null -w 'rodya.ru -> %{http_code}\n' https://rodya.ru/
